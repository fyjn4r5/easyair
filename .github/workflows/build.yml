name: Build EasyAir for Mint 21.3 (Ubuntu 22.04)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            python3 python3-venv python3-pip \
            aircrack-ng hashcat hcxtools \
            libgl1-mesa-glx libxcb-xinerama0 libxcb-cursor0 \
            xvfb \
            2>&1 | tail -10

      - name: Create venv & install Python deps
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install PyQt5 psutil pyinstaller

      - name: Verify imports (offscreen)
        run: |
          source .venv/bin/activate
          QT_QPA_PLATFORM=offscreen python3 -c "
          import sys
          sys.path.insert(0, '.')
          from PyQt5.QtWidgets import QApplication
          import psutil
          import core.aircore
          import ui.main_ui
          app = QApplication([])
          win = ui.main_ui.MainUI()
          print('MainUI created OK')
          print('Log tabs:', win.log_tabs.count())
          print('Result tabs:', win.result_tabs.count())
          print('Cap tree:', hasattr(win, 'cap_tree'))
          print('Engine label:', hasattr(win, 'lbl_engine'))
          print('All modules OK')
          "

      - name: Run offline E2E tests
        run: |
          source .venv/bin/activate
          QT_QPA_PLATFORM=offscreen python3 tests/test_e2e.py

      - name: Build with PyInstaller
        run: |
          source .venv/bin/activate
          cd ${{ github.workspace }}
          .venv/bin/pyinstaller --onefile --clean --noconfirm \
            --name easyair \
            --add-data "core:core" \
            --add-data "ui:ui" \
            --add-data "config:config" \
            --paths=. \
            --hidden-import=PyQt5 \
            --hidden-import=PyQt5.QtCore \
            --hidden-import=PyQt5.QtWidgets \
            --hidden-import=PyQt5.QtGui \
            --hidden-import=PyQt5.QtPrintSupport \
            --hidden-import=PyQt5.sip \
            --hidden-import=psutil \
            --hidden-import=ui \
            --hidden-import=ui.main_ui \
            --hidden-import=core \
            --hidden-import=core.aircore \
            main.py

      - name: Verify binary
        run: |
          ls -lh dist/easyair
          file dist/easyair
          QT_QPA_PLATFORM=offscreen timeout 5 ./dist/easyair 2>&1 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: easyair-${{ steps.vars.outputs.VERSION }}-linux-x64
          path: dist/easyair
          retention-days: 30

      - name: Create Release (on tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: dist/easyair
          tag_name: ${{ steps.vars.outputs.VERSION }}
          name: EasyAir ${{ steps.vars.outputs.VERSION }}
          body: |
            **EasyAir** - 傻瓜式 WiFi 抓包破解工具 (Mint 21.3 / Ubuntu 22.04+)
            
            - 自动监听模式开启/关闭
            - 多字典拖拽排序持久化
            - Hashcat (GPU/CPU) / Aircrack-ng 双引擎
            - 一键全自动流程
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
